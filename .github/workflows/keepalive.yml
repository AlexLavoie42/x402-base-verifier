name: Keep x402 endpoint warm (free-tier spin-down is ~15 min)
on:
  schedule:
    - cron: "*/5 * * * *" # minimum Actions granularity; keeps the service warm
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 https://x402-verifier.onrender.com/health || true)
          echo "health -> $code"
          # any 2xx is success; log the code for the run history
          if [ "$code" = "200" ]; then exit 0; fi
          # a cold-start timeout still returns something eventually; fail loudly otherwise
          if [ "$code" = "000" ]; then echo "unreachable"; exit 1; fi
          exit 0
