services:
  - type: web
    name: x402-base-verifier
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev && npx tsc -p tsconfig.json
    startCommand: node dist/src/server-main.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Set BASE_URL in the Render dashboard: https://x402-verifier.onrender.com
      # RPC_URLS optional; defaults to the public fallback list in src/config.ts
      # FACILITATOR_URL optional; unset = in-process verify-only facilitator (see MIGRATION.md)
