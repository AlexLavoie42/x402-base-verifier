services:
  - type: web
    name: x402-base-verifier
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev && npx tsc -p tsconfig.json
    startCommand: node dist/src/server-main.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # BASE_URL is set by Render automatically (https) — see RENDER-DEPLOY.md
      # RPC_URLS optional; defaults to the public fallback list in src/config.ts
